# Modified by SysopBP, 2026-10-14: pin workflow dependencies to verified commits.
name: Capture D2 0.4.5 Beta 1 screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/screenshots.yml'
      - 'app/src/androidTest/java/app/d2lock/ScreenshotCaptureTest.kt'
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.3.1'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: gradle wrapper --gradle-version 9.3.1
      - name: Build before starting emulator
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            adb shell wm size 720x1600
            adb shell wm density 280
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell settings put system screen_off_timeout 1800000
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.d2lock.ScreenshotCaptureTest -Pandroid.testInstrumentationRunnerArguments.screenshots=true --stacktrace
            adb pull /data/local/tmp/d2-screenshots screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: D2-045-Beta1-AMOLED-previews
          path: screenshots/*.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshot-capture-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
