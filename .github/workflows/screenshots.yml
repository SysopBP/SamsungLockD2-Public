name: Capture D2 0.4.4 update screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/screenshots.yml'
      - 'app/src/androidTest/java/app/d2lock/ScreenshotCaptureTest.kt'
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: gradle wrapper --gradle-version 9.3.1
      - name: Build before starting emulator
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            adb shell wm size 720x1600
            adb shell wm density 280
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell settings put system screen_off_timeout 1800000
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.d2lock.ScreenshotCaptureTest -Pandroid.testInstrumentationRunnerArguments.screenshots=true --stacktrace
            adb pull /data/local/tmp/d2-screenshots screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: D2-044-themes
          path: screenshots/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-capture-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
