name: Publish D2 0.6.3 Preview 1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/d2-063-preview.yml', 'docs/releases/d2-063-preview.md', 'docs/releases/d2-063-setup.md']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: d2-063-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: f6a64d646646e851190e4d31df8029dffd1311ed
      RELEASE_TAG: v0.6.3-preview.1
    steps:
      - uses: actions/checkout@v4
      - name: Package successful Build 993
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GH_REPO/actions/runs/38038382440 > run.json
          jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success"' run.json
          gh run download 38038382440 -n Kiosk-D2-Guardian-deliverables -D dist
          test -s dist/Kiosk-D2-Guardian-debug.apk
          test -s dist/Kiosk-D2-Guardian-KernelSU-OPTIONAL.zip
          sha256sum --check dist/SHA256SUMS.txt
          unzip -t dist/Kiosk-D2-Guardian-KernelSU-OPTIONAL.zip
          if unzip -Z1 dist/Kiosk-D2-Guardian-KernelSU-OPTIONAL.zip | grep -E '(\.apk$|^system/)'; then
            echo "::error::Unexpected injected or bundled module APK"
            exit 1
          fi
          gh release download v0.6.2-beta.1 --pattern Galaxy-Island-v0.2.1-beta-run191.apk --dir dist
          echo '0b1c69374bfb6789abd9d27b070d99efe0142fd65d4cf49ee4e4bdd61cc6ab6d  dist/Galaxy-Island-v0.2.1-beta-run191.apk' | sha256sum --check
          cp docs/releases/d2-063-preview.md dist/D2-0.6.3-Release-Notes.md
          cp docs/releases/d2-063-setup.md dist/D2-0.6.3-Setup.md
          cp AUDIT_REPAIRS.md dist/D2-Audit-Repairs.md
          (cd dist && sha256sum *.apk *.zip *.md runtime-dependencies.txt > SHA256SUMS.txt)
      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/Galaxy-Island-v0.2.1-beta-run191.apk dist/D2-0.6.3-Release-Notes.md dist/D2-0.6.3-Setup.md dist/SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --notes-file docs/releases/d2-063-preview.md
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/* --target "$SOURCE_SHA" --title "Kiosk D2 Guardian 0.6.3 — Preview 1 | Audit Repairs" --notes-file docs/releases/d2-063-preview.md --prerelease
