name: Publish tested v0.4.1 preview
on:
  push:
    paths:
      - .github/workflows/publish-preview.yml
permissions:
  actions: read
  contents: write
jobs:
  release:
    if: github.repository == 'SysopBP/SamsungLockD2-Public'
    runs-on: ubuntu-latest
    steps:
      - name: Download tested build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35443284342 --repo SysopBP/SamsungLockD2-Public --name SamsungLockD2-deliverables --dir dist
          sha256sum --check dist/SHA256SUMS.txt
          unzip -t dist/SamsungLockD2-KSUNext-v0.5.1-bundled.zip
          cmp dist/SamsungLockD2-debug.apk <(unzip -p dist/SamsungLockD2-KSUNext-v0.5.1-bundled.zip payload/SamsungLockD2.apk)
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## Samsung Lock D2 v0.4.1 preview
          
          User-tested update for the public experimental preview. Adds visible media and controls, Fahrenheit/Celsius selection, configurable bottom shortcuts, a floating action bar, and notification privacy settings. The notification fix adds **All previews (private too)**: choose it in D2 settings and grant notification access to show ordinary notification text while locked. **Public only** shows text only when an app explicitly marks a notification public; secret notifications stay hidden while locked.
          
          Install the debug APK. The KernelSU Next ZIP is optional and contains the same APK. If Android rejects installation over a previous debug build because its signing certificate differs, uninstall the older app first; doing so clears the D2 PIN and settings.
          
          D2 is an experimental app privacy screen, not a replacement for Android's secure device lock or encryption. See the [README](https://github.com/SysopBP/SamsungLockD2-Public#readme) for setup and recovery details.
          NOTES
          gh release create v0.4.1-preview.1 --repo SysopBP/SamsungLockD2-Public --target "${GITHUB_SHA}" --title "Samsung Lock D2 v0.4.1 — media and notification preview" --prerelease --notes-file release-notes.md dist/SamsungLockD2-debug.apk dist/SamsungLockD2-KSUNext-v0.5.1-bundled.zip dist/SamsungLockD2-source.zip dist/SHA256SUMS.txt
