name: Publish Samsung Lock D2 Beta

on:
  push:
    paths:
      - .github/workflows/publish-preview.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: github.repository == 'SysopBP/SamsungLockD2-Public'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download D2 build from current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          MAIN_SHA="$(git rev-parse HEAD)"
          RUN_ID="$(gh run list --repo SysopBP/SamsungLockD2-Public --workflow android.yml --branch main --commit "$MAIN_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful D2 build exists for current main commit $MAIN_SHA"
            exit 1
          fi
          echo "Packaging D2 run $RUN_ID for main $MAIN_SHA"
          gh run download "$RUN_ID" --repo SysopBP/SamsungLockD2-Public --name SamsungLockD2-deliverables --dir dist
          (cd dist && sha256sum --check SHA256SUMS.txt)

      - name: Download latest Galaxy Island Glass build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p galaxy-island
          gh run download 35840069493 --repo SysopBP/SamsungLockD2-Public --name Galaxy-Island-glass-APK --dir galaxy-island
          find galaxy-island -type f -maxdepth 2 -print
          cp galaxy-island/*.apk dist/Galaxy-Island-Glass.apk

      - name: Verify and create beta bundle
        run: |
          set -e
          KSZIP="$(find dist -maxdepth 1 -type f -name '*KSUNext*.zip' | head -1)"
          test -n "$KSZIP"
          unzip -t "$KSZIP"
          cmp dist/SamsungLockD2-debug.apk <(unzip -p "$KSZIP" payload/SamsungLockD2.apk)
          (cd dist && sha256sum SamsungLockD2-debug.apk Galaxy-Island-Glass.apk "$(/usr/bin/basename "$KSZIP")" > BETA-SHA256SUMS.txt)
          mkdir -p bundle
          cp dist/SamsungLockD2-debug.apk bundle/
          cp dist/Galaxy-Island-Glass.apk bundle/
          cp "$KSZIP" bundle/
          cp dist/SHA256SUMS.txt bundle/D2-SHA256SUMS.txt
          cp dist/BETA-SHA256SUMS.txt bundle/
          if [ -f dist/SamsungLockD2-source.zip ]; then cp dist/SamsungLockD2-source.zip bundle/; fi
          zip -j SamsungLockD2-v0.5.0-beta.1-hotfix.1-bundle.zip bundle/*

      - name: Upload beta bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamsungLockD2-v0.5.0-beta.1-hotfix.1-bundle
          path: |
            SamsungLockD2-v0.5.0-beta.1-hotfix.1-bundle.zip
            bundle/*
          if-no-files-found: error
          retention-days: 90
