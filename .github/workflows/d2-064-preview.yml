name: Publish D2 0.6.4 Preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/d2-064-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: d2-064-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 54ad8616b9b6f1ecd90feeaed5d3cec40a78abdd
      RELEASE_TAG: v0.6.4-preview.2
    steps:
      - uses: actions/checkout@v4
      - name: Verify and package successful Build 1057
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GH_REPO/actions/runs/38462517827 > run.json
          jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success"' run.json
          gh run download 38462517827 -n Kiosk-D2-Guardian-deliverables -D dist
          sha256sum --check dist/SHA256SUMS.txt
          test -s dist/Kiosk-D2-Guardian-debug.apk
          test -s dist/Kiosk-D2-Guardian-KernelSU-OPTIONAL.zip
          unzip -t dist/Kiosk-D2-Guardian-KernelSU-OPTIONAL.zip
          if unzip -Z1 dist/Kiosk-D2-Guardian-KernelSU-OPTIONAL.zip | grep -E '(\.apk$|^system/)'; then
            echo "::error::Unexpected injected or bundled module APK"
            exit 1
          fi
          cp docs/INSTALLATION-0.6.4-PREVIEW.md dist/D2-0.6.4-Installation-Guide.md
          cp docs/RELEASE-0.6.4-PREVIEW.md dist/D2-0.6.4-Release-Notes.md
          cp docs/screenshots/d2-064-preview-setup-collage.png dist/D2-0.6.4-Preview-Setup-Collage.png
          (cd dist && sha256sum *.apk *.zip *.md *.png runtime-dependencies.txt > SHA256SUMS.txt)
      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing automatic replacement"
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* --target "$SOURCE_SHA" --title "D2 Guardian 0.6.4 Preview 2 — Call Hotfix & New UI" --notes-file docs/RELEASE-0.6.4-PREVIEW.md --prerelease
          gh release view "$RELEASE_TAG" --json url,isPrerelease,assets
