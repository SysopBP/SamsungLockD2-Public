name: Diagnose Galaxy Island released APKs
on:
  push:
    branches: [diagnostics/galaxy-island-overlay-20260920]
permissions:
  contents: read
jobs:
  overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Download published APKs
        run: |
          mkdir apks
          curl -fL --retry 3 -o apks/galaxy.apk https://github.com/SysopBP/SamsungLockD2-Public/releases/download/v0.4.4-preview.1/Galaxy-Island-themed.apk
          curl -fL --retry 3 -o apks/old-d2.apk https://github.com/SysopBP/SamsungLockD2-Public/releases/download/v0.4.4-preview.1/SamsungLockD2-v0.4.4-paired-themes.apk
          curl -fL --retry 3 -o apks/new-d2.apk https://github.com/SysopBP/SamsungLockD2-Public/releases/download/v0.4.4-preview.2/SamsungLockD2-debug.apk
          echo 'e1ad0c42437fbd0bc714cea56ce1f21e0411a7c67412e4cd89cfb9c7cb8ba526  apks/galaxy.apk' | sha256sum -c
          echo '41b3cbdbd71965b17830c183087e294d7d53c10469f79a47907a4391b0c19b9d  apks/new-d2.apk' | sha256sum -c
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual release upgrade and overlay lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: python3 tools/galaxy_overlay_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galaxy-overlay-diagnostics
          path: diagnostics/
