name: Build APK and KernelSU module
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/screenshots.yml'
      - 'app/src/androidTest/java/app/d2lock/ScreenshotCaptureTest.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1
      - name: Build and lint
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > runtime-dependencies.txt
          ./gradlew assembleDebug lintDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          # This Kotlin-only app does not use the runner's preinstalled native SDKs.
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          df -h /home/runner
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: PIN, kiosk, and Preview runtime tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell settings put system screen_off_timeout 1800000
            ./gradlew connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
      - name: Package deliverables
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SamsungLockD2-debug.apk
          cp dist/SamsungLockD2-debug.apk module/payload/SamsungLockD2.apk
          cp LICENSE THIRD_PARTY_NOTICES.txt module/
          rm module/payload/PLACE_APK_HERE.txt
          for script in module/*.sh; do bash -n "$script"; done
          chmod 755 module/*.sh
          (cd module && zip -r ../dist/SamsungLockD2-KSUNext-v0.5.0-bundled.zip .)
          unzip -t dist/SamsungLockD2-KSUNext-v0.5.0-bundled.zip
          zip -r dist/SamsungLockD2-source.zip app/src app/build.gradle.kts build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew gradlew.bat module README.md LICENSE THIRD_PARTY_NOTICES.txt docs .github
          cp runtime-dependencies.txt dist/
          sha256sum dist/*.apk dist/*.zip > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SamsungLockD2-deliverables
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*
