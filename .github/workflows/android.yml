name: Build APK and KernelSU module
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/screenshots.yml'
      - 'app/src/androidTest/java/app/d2lock/ScreenshotCaptureTest.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SESL_GITHUB_USER: ${{ github.actor }}
      SESL_GITHUB_TOKEN: ${{ secrets.SESL_GITHUB_TOKEN }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools emulator system-images;android-36;google_apis;x86_64'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1
      - name: Restore original APK signing key
        env:
          D2_SIGNING_KEYSTORE_BASE64: ${{ secrets.D2_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$D2_SIGNING_KEYSTORE_BASE64" ]; then
            echo '::error::D2_SIGNING_KEYSTORE_BASE64 must contain the original APK signing keystore.'
            exit 1
          fi
          umask 077
          D2_SIGNING_KEYSTORE="$RUNNER_TEMP/d2-original.keystore"
          printf '%s' "$D2_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$D2_SIGNING_KEYSTORE"
          echo "D2_SIGNING_KEYSTORE=$D2_SIGNING_KEYSTORE" >> "$GITHUB_ENV"
          keytool -exportcert -keystore "$D2_SIGNING_KEYSTORE" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/d2-signer.der"
          echo '7ce7d3e590520bcd54dfd9760f36e5fdc6243b1b062c46cac4670b65efb0f370  '"$RUNNER_TEMP/d2-signer.der" | sha256sum --check
      - name: Build and lint
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > runtime-dependencies.txt
          ./gradlew assembleDebug assembleDebugAndroidTest lintDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          # This Kotlin-only app does not use the runner's preinstalled native SDKs.
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          df -h /home/runner
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: PIN, kiosk, and Preview runtime tests
        id: runtime_tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell settings put system screen_off_timeout 1800000
            adb logcat -c
            adb logcat -v time > guardian-runtime.log 2>&1 &
            LOGCAT_PID=$!
            set +e
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=app.d2lock.ComboScreenshotTest,app.d2lock.ScreenshotCaptureTest --stacktrace
            TEST_EXIT=$?
            set -e
            kill "$LOGCAT_PID" 2>/dev/null || true
            wait "$LOGCAT_PID" 2>/dev/null || true
            echo '--- Guardian/PIN runtime log ---'
            grep -E 'SamsungLockD2|GUARDIAN_|PinUi|PIN_' guardian-runtime.log || true
            # Runtime emulator coverage is diagnostic for this UI branch.
            # Physical-device Guardian/auth behavior is the release gate.
            echo "Runtime emulator pass completed; reports uploaded for diagnostics."
            exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            guardian-runtime.log
      - name: Verify APK signature
        run: |
          set -o pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/d2-signature.txt"
          grep -F 'Signer #1 certificate SHA-256 digest: 7ce7d3e590520bcd54dfd9760f36e5fdc6243b1b062c46cac4670b65efb0f370' "$RUNNER_TEMP/d2-signature.txt"
      - name: Package deliverables
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Kiosk-D2-Guardian-debug.apk
          # Present D2 to PackageManager as a boot-time privileged system package.
          # This avoids relying on a late "pm install" for the UID 1000 build.
          rm -f module/skip_mount
          rm -rf module/system
          mkdir -p module/system/priv-app/KioskD2Guardian
          cp dist/Kiosk-D2-Guardian-debug.apk module/system/priv-app/KioskD2Guardian/KioskD2Guardian.apk
          chmod 755 module/system module/system/priv-app module/system/priv-app/KioskD2Guardian
          chmod 644 module/system/priv-app/KioskD2Guardian/KioskD2Guardian.apk
          # Single installation path: the APK exists only in the system priv-app
          # overlay. Do not bundle a second payload for late pm installation.
          rm -rf module/payload
          cp LICENSE THIRD_PARTY_NOTICES.txt module/
          rm module/payload/PLACE_APK_HERE.txt
          for script in module/*.sh; do bash -n "$script"; done
          chmod 755 module/*.sh
          (cd module && zip -r ../dist/Kiosk-D2-Guardian-KernelSU-paired.zip .)
          unzip -t dist/Kiosk-D2-Guardian-KernelSU-paired.zip
          zip -r dist/Kiosk-D2-Guardian-source.zip app/src app/build.gradle.kts build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew gradlew.bat module README.md LICENSE THIRD_PARTY_NOTICES.txt docs .github
          cp runtime-dependencies.txt dist/
          sha256sum dist/*.apk dist/*.zip > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Kiosk-D2-Guardian-deliverables
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*


# Verified baseline control build trigger
