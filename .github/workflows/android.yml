# Modified by SysopBP, 2026-10-14: pin workflow dependencies to verified commits.
name: Build APK and KernelSU module
# rebuild: early BOOT_READY validation 919
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/screenshots.yml'
      - 'app/src/androidTest/java/app/d2lock/ScreenshotCaptureTest.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SESL_GITHUB_USER: ${{ github.actor }}
      SESL_GITHUB_TOKEN: ${{ secrets.SESL_GITHUB_TOKEN }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '24'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools emulator system-images;android-36;google_apis;x86_64'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1
      - name: Restore original APK signing key
        env:
          D2_SIGNING_KEYSTORE_BASE64: ${{ secrets.D2_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$D2_SIGNING_KEYSTORE_BASE64" ]; then
            echo '::error::D2_SIGNING_KEYSTORE_BASE64 must contain the original APK signing keystore.'
            exit 1
          fi
          umask 077
          D2_SIGNING_KEYSTORE="$RUNNER_TEMP/d2-original.keystore"
          printf '%s' "$D2_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$D2_SIGNING_KEYSTORE"
          echo "D2_SIGNING_KEYSTORE=$D2_SIGNING_KEYSTORE" >> "$GITHUB_ENV"
          keytool -exportcert -keystore "$D2_SIGNING_KEYSTORE" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/d2-signer.der"
          echo '7ce7d3e590520bcd54dfd9760f36e5fdc6243b1b062c46cac4670b65efb0f370  '"$RUNNER_TEMP/d2-signer.der" | sha256sum --check
      - name: Check bundled third-party notices
        run: |
          cmp THIRD_PARTY_NOTICES.txt app/src/main/assets/THIRD_PARTY_NOTICES.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('THIRD_PARTY_NOTICES.txt').read_text()
          assert 'MIT License' in text and 'Copyright (c) 2021 RikkaW' in text
          assert 'Apache License' in text
          PY
      - name: Build and lint
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > runtime-dependencies.txt
          ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          # This Kotlin-only app does not use the runner's preinstalled native SDKs.
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          df -h /home/runner
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: PIN, kiosk, and Preview runtime tests
        id: runtime_tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: bash .github/scripts/runtime-tests.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: preview-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            guardian-runtime.log
      - name: Verify APK signature
        run: |
          set -o pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/d2-signature.txt"
          grep -F 'Signer #1 certificate SHA-256 digest: 7ce7d3e590520bcd54dfd9760f36e5fdc6243b1b062c46cac4670b65efb0f370' "$RUNNER_TEMP/d2-signature.txt"
      - name: Package deliverables
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Kiosk-D2-Guardian-debug.apk
          # Stable test packaging: D2 remains a normal user-installed APK.
          # Do not mount/inject the APK through /system/priv-app and do not
          # attempt to obtain android.uid.system / UID 1000.
          rm -rf module/system
          touch module/skip_mount
          rm -rf module/payload
          mkdir -p module/payload
          cp LICENSE THIRD_PARTY_NOTICES.txt module/
          printf '%s\n' 'Optional bridge only. Install Kiosk-D2-Guardian-debug.apk normally and enable KernelSU Root Mode in D2 System Integrations. Leave this module disabled unless intentionally testing the separate bridge path.' > module/payload/PLACE_APK_HERE.txt
          for script in module/*.sh; do bash -n "$script"; done
          chmod 755 module/*.sh
          (cd module && zip -r ../dist/Kiosk-D2-Guardian-KernelSU-OPTIONAL.zip .)
          unzip -t dist/Kiosk-D2-Guardian-KernelSU-OPTIONAL.zip
          zip -r dist/Kiosk-D2-Guardian-source.zip app/src app/build.gradle.kts build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew gradlew.bat module README.md LICENSE THIRD_PARTY_NOTICES.txt docs .github
          cp runtime-dependencies.txt dist/
          sha256sum dist/*.apk dist/*.zip > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Kiosk-D2-Guardian-deliverables
          path: dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*


# Verified baseline control build trigger

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/d2-original.keystore" "$RUNNER_TEMP/d2-signer.der"
