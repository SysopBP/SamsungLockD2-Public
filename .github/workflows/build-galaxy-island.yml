name: Build Galaxy Island Glass

on:
  workflow_dispatch:
  push:
    paths:
      - "galaxy-island/**"
      - "scripts/galaxy_island_overhaul.py"
      - ".github/workflows/build-galaxy-island.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout D2 repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Galaxy Island base source
        run: |
          curl -fL --retry 3 "https://github.com/SysopBP/SamsungLockD2-Public/releases/download/v0.4.4-preview.1/Galaxy-Island-themed-source.zip" -o /tmp/galaxy-island-source.zip
          mkdir -p /tmp/galaxy-island
          unzip -q /tmp/galaxy-island-source.zip -d /tmp/galaxy-island

      - name: Apply One UI 9 glass overhaul
        run: |
          cd /tmp/galaxy-island/Galaxy-Island
          find app/src -type f \( -name "*.kt" -o -name "*.xml" \) -exec sed -i 's/\r$//' {} +
          python3 "$GITHUB_WORKSPACE/scripts/galaxy_island_overhaul.py"
          chmod +x gradlew

      - name: Build Galaxy Island APK
        working-directory: /tmp/galaxy-island/Galaxy-Island
        run: ./gradlew --no-daemon assembleDebug

      - name: Run unit tests
        working-directory: /tmp/galaxy-island/Galaxy-Island
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Collect APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/galaxy-island-output"
          find /tmp/galaxy-island/Galaxy-Island/app/build/outputs/apk -type f -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/galaxy-island-output/Galaxy-Island-glass-debug.apk" \;

      - name: Upload Galaxy Island APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Island-glass-APK
          path: galaxy-island-output/Galaxy-Island-glass-debug.apk
          if-no-files-found: error
