name: Build Galaxy Island Glass

on:
  workflow_dispatch:
  push:
    paths:
      - "galaxy-island/**"
      - ".github/workflows/build-galaxy-island.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout D2 repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Galaxy Island base source
        run: |
          curl -fL --retry 3             "https://github.com/SysopBP/SamsungLockD2-Public/releases/download/v0.4.4-preview.1/Galaxy-Island-themed-source.zip"             -o /tmp/galaxy-island-source.zip
          mkdir -p /tmp/galaxy-island
          unzip -q /tmp/galaxy-island-source.zip -d /tmp/galaxy-island

      - name: Apply One UI 9 glass overhaul
        run: |
          cd /tmp/galaxy-island/Galaxy-Island
          find app/src -type f \( -name "*.kt" -o -name "*.xml" \) -exec sed -i 's/\r$//' {} +
          python3 - <<'PY'
          from pathlib import Path

          root = Path("/tmp/galaxy-island/Galaxy-Island")

          def edit(rel, replacements):
              path = root / rel
              text = path.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"Galaxy Island source drift: missing anchor in {rel}: {old[:80]!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

          # D2 Guardian visual language: compact One UI 9 / Material 3 surfaces.
          # Keep upstream behavior intact while making the Galaxy Island settings feel native to D2.
          settings = "app/src/main/java/com/ekoehler/expressivecutout/ui/screen/SettingScreens/AppearanceScreen.kt"
          strings = "app/src/main/res/values/strings.xml"

          prefs = "app/src/main/java/com/ekoehler/expressivecutout/data/AppearancePreferences.kt"
          edit(prefs, [
              ("data class AppearanceSettings(\n    val shadowEnabled:", "data class AppearanceSettings(\n    val glassEnabled: Boolean = DEFAULT_GLASS_ENABLED,\n    val shadowEnabled:"),
              ("companion object {\n        const val DEFAULT_SHADOW_ENABLED", "companion object {\n        const val DEFAULT_GLASS_ENABLED = true\n        const val DEFAULT_SHADOW_ENABLED"),
              ("AppearanceSettings(\n            shadowEnabled =", "AppearanceSettings(\n            glassEnabled = prefs[GLASS_ENABLED] ?: AppearanceSettings.DEFAULT_GLASS_ENABLED,\n            shadowEnabled ="),
              ("return JSONObject().apply {\n            put(\"shadowEnabled\"", "return JSONObject().apply {\n            put(\"glassEnabled\", s.glassEnabled)\n            put(\"shadowEnabled\""),
              ("context.appearanceDataStore.edit {\n            if (obj.has(\"shadowEnabled\"))", "context.appearanceDataStore.edit {\n            if (obj.has(\"glassEnabled\")) it[GLASS_ENABLED] = obj.getBoolean(\"glassEnabled\")\n            if (obj.has(\"shadowEnabled\"))"),
              ("    suspend fun setShadowEnabled(enabled: Boolean)", "    suspend fun setGlassEnabled(enabled: Boolean) = context.appearanceDataStore.edit {\n        it[GLASS_ENABLED] = enabled\n    }\n\n    suspend fun setShadowEnabled(enabled: Boolean)"),
              ("private companion object {\n        val SHADOW_ENABLED", "private companion object {\n        val GLASS_ENABLED = booleanPreferencesKey(\"glass_enabled\")\n        val SHADOW_ENABLED"),
          ])

          # Hotfix 1: wrap the existing Size & Position content in a glass Surface.
          # Do this after the camera/X-Y edit below so both transforms share one stable anchor.

          # The base project already persists offsetXDp/offsetYDp in LayoutPreferences and
          # applies them live. Make those controls explicit as camera/island positioning rather
          # than introducing a second geometry store.
          size_screen = "app/src/main/java/com/ekoehler/expressivecutout/ui/screen/SettingScreens/SizePositionScreen.kt"
          edit(size_screen, [
              ("    Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {", "    Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {\n        Text(\n            text = \"Camera / Island Position\",\n            style = MaterialTheme.typography.titleMedium,\n            modifier = Modifier.padding(top = 8.dp, bottom = 2.dp),\n        )\n        Text(\n            text = \"Fine-tune the island around the physical camera. Changes preview live and are saved automatically.\",\n            style = MaterialTheme.typography.bodySmall,\n            color = MaterialTheme.colorScheme.onSurfaceVariant,\n            modifier = Modifier.padding(bottom = 4.dp),\n        )"),
              ("label = stringResource(R.string.appearance_vertical),", "label = \"Camera Y position\","),
              ("label = stringResource(R.string.appearance_horizontal),", "label = \"Camera X position\","),
              ("Text(stringResource(R.string.action_reset_layout))", "Text(\"Reset to camera / device default\")"),
          ])

          # Hotfix visual pass 1: make the positioning section feel more like the
          # glass island without changing the upstream composable hierarchy.
          size_ui = root / size_screen
          size_text = size_ui.read_text()
          size_text = size_text.replace(
              'style = MaterialTheme.typography.titleMedium,\\n            modifier = Modifier.padding(top = 8.dp, bottom = 2.dp),',
              'style = MaterialTheme.typography.titleMedium,\\n            color = MaterialTheme.colorScheme.primary,\\n            modifier = Modifier.padding(top = 10.dp, bottom = 3.dp),',
              1,
          )
          size_text = size_text.replace(
              'color = MaterialTheme.colorScheme.onSurfaceVariant,\\n            modifier = Modifier.padding(bottom = 4.dp),',
              'color = MaterialTheme.colorScheme.onSurfaceVariant.copy(alpha = 0.78f),\\n            modifier = Modifier.padding(bottom = 8.dp),',
              1,
          )
          size_ui.write_text(size_text)

          # Hotfix visual pass 2: apply a safe glass-card treatment to the existing
          # DimensionsEditor surface. Keep the editor hierarchy and control logic intact.
          size_text = size_ui.read_text()
          if "import androidx.compose.foundation.background" not in size_text:
              size_text = size_text.replace(
                  "import androidx.compose.foundation.isSystemInDarkTheme",
                  "import androidx.compose.foundation.background\nimport androidx.compose.foundation.isSystemInDarkTheme",
                  1,
              )
          if "import androidx.compose.foundation.shape.RoundedCornerShape" not in size_text:
              size_text = size_text.replace(
                  "import androidx.compose.foundation.layout.width",
                  "import androidx.compose.foundation.layout.width\nimport androidx.compose.foundation.shape.RoundedCornerShape",
                  1,
              )
          size_text = size_text.replace(
              "    Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {",
              "    Column(\n        modifier = Modifier\n            .fillMaxWidth()\n            .background(\n                color = MaterialTheme.colorScheme.surfaceVariant.copy(alpha = 0.38f),\n                shape = RoundedCornerShape(28.dp),\n            )\n            .padding(horizontal = 16.dp, vertical = 14.dp),\n        verticalArrangement = Arrangement.spacedBy(8.dp),\n    ) {",
              1,
          )
          size_ui.write_text(size_text)

          # Visual pass 3: polish the editor typography and reset control while
          # keeping the proven slider/corner implementations untouched.
          size_text = size_ui.read_text()
          size_text = size_text.replace(
              'text = stringResource(R.string.appearance_corner),\n            style = MaterialTheme.typography.bodyMedium,',
              'text = stringResource(R.string.appearance_corner),\n            style = MaterialTheme.typography.labelLarge,\n            color = MaterialTheme.colorScheme.onSurfaceVariant,',
              1,
          )
          size_text = size_text.replace(
              'modifier = Modifier.fillMaxWidth(),\n        ) {\n            Icon(\n                imageVector = Icons.Rounded.RestartAlt,',
              'modifier = Modifier.fillMaxWidth(),\n            shape = RoundedCornerShape(22.dp),\n        ) {\n            Icon(\n                imageVector = Icons.Rounded.RestartAlt,',
              1,
          )
          size_ui.write_text(size_text)

          # Visual pass 4: locate the shared AdjustableSlider implementation and
          # give its labels/values a softer One UI treatment without altering slider behavior.
          slider_file = None
          for candidate in root.rglob("*.kt"):
              candidate_text = candidate.read_text()
              if "fun AdjustableSlider(" in candidate_text:
                  slider_file = candidate
                  slider_text = candidate_text
                  break
          if slider_file is None:
              raise SystemExit("Galaxy Island source drift: AdjustableSlider implementation not found")
          slider_text = slider_text.replace(
              "style = MaterialTheme.typography.bodyMedium,",
              "style = MaterialTheme.typography.labelLarge,",
          )
          slider_text = slider_text.replace(
              "style = MaterialTheme.typography.bodySmall,",
              "style = MaterialTheme.typography.labelMedium,",
          )
          slider_file.write_text(slider_text)

          vm = "app/src/main/java/com/ekoehler/expressivecutout/ui/AppViewModel.kt"
          edit(vm, [
              ("    fun setShadowEnabled(enabled: Boolean)", "    fun setGlassEnabled(enabled: Boolean) = viewModelScope.launch {\n        appearancePreferences.setGlassEnabled(enabled)\n    }\n\n    fun setShadowEnabled(enabled: Boolean)")
          ])

          screen = "app/src/main/java/com/ekoehler/expressivecutout/ui/screen/SettingScreens/AppearanceScreen.kt"
          edit(screen, [
              ("        SettingsToggleCard(\n            shape = RoundedCornerShape(24.dp),\n            title = stringResource(R.string.appearance_shadow_title)", "        SettingsToggleCard(\n            shape = RoundedCornerShape(24.dp),\n            title = stringResource(R.string.appearance_glass_title),\n            description = stringResource(R.string.appearance_glass_desc),\n            checked = appearance.glassEnabled,\n            onCheckedChange = viewModel::setGlassEnabled,\n        )\n\n        SettingsToggleCard(\n            shape = RoundedCornerShape(24.dp),\n            title = stringResource(R.string.appearance_shadow_title)")
          ])

          strings = "app/src/main/res/values/strings.xml"
          edit(strings, [
              ("    <string name=\"appearance_section_title\">Appearance</string>", "    <string name=\"appearance_section_title\">Appearance</string>\n    <string name=\"appearance_glass_title\">Guardian glass</string>\n    <string name=\"appearance_glass_desc\">Match Kiosk D2 Guardian with translucent One UI 9 surfaces, soft highlight edges and floating depth.</string>")
          ])

          # Galaxy Island first-run/setup guide. Keep this inside the proven Appearance
          # screen so onboarding does not require a new navigation graph in the upstream source.
          appearance_ui = root / screen
          appearance_text = appearance_ui.read_text()
          if "Galaxy Island Setup" not in appearance_text:
              # Reuse the existing settings-card vocabulary and put a concise setup checklist
              # ahead of appearance controls. Users can revisit it from Appearance at any time.
              setup_card = '''        SettingsInfoCard(
            shape = RoundedCornerShape(24.dp),
            title = "What's New Since Beta.1",
            description = "Guardian Glass and One UI 9 styling\\n• Persistent glass appearance controls\\n• Camera / Island X and Y positioning with live preview\\n• Reset to camera / device default\\n• Refined glass cards, typography and controls\\n• Notification pop-out and transparency refinements\\n• Kiosk D2 Guardian pairing and synchronization groundwork\\n• Xposed integration gates for notifications, media, charging, calls, screen state and positioning\\n• Guardian fallback bridge\\n• New Galaxy Island setup guidance",
        )

        SettingsInfoCard(
            shape = RoundedCornerShape(24.dp),
            title = "Galaxy Island Setup",
            description = "1  Allow required notification/overlay access\\n2  Position the island around your camera\\n3  Choose Guardian glass and transparency\\n4  Review notification privacy\\n5  Pair Kiosk D2 Guardian when installed\\n6  Test media, charging, calls and notification pop-outs",
        )

'''
              marker = "        SettingsToggleCard(\n            shape = RoundedCornerShape(24.dp),\n            title = stringResource(R.string.appearance_glass_title),"
              if marker not in appearance_text:
                  raise SystemExit("Galaxy Island source drift: setup-card anchor not found")
              appearance_text = appearance_text.replace(marker, setup_card + marker, 1)
              appearance_ui.write_text(appearance_text)

          # Add a persistent setup note to the strings shipped with the paired build.
          strings_ui = root / strings
          strings_text = strings_ui.read_text()
          if "galaxy_setup_summary" not in strings_text:
              strings_text = strings_text.replace(
                  "</resources>",
                  '    <string name="galaxy_setup_summary">Setup: permissions • position • Guardian glass • privacy • Guardian pairing • test island</string>\\n</resources>',
                  1,
              )
              strings_ui.write_text(strings_text)

          island = "app/src/main/java/com/ekoehler/expressivecutout/overlay/DynamicIsland.kt"
          edit(island, [
              ("    val border = if (appearance.strokeEnabled) {", "    val border = if (appearance.glassEnabled) {\n        BorderStroke(1.dp, Color.White.copy(alpha = 0.24f))\n    } else if (appearance.strokeEnabled) {"),
              ("    Surface(\n        modifier = modifier.background(currentBaseColor, shape),\n        shape = shape,\n        color = currentBaseColor,", "    val surfaceColor = if (appearance.glassEnabled) currentBaseColor.copy(alpha = 0.72f) else currentBaseColor\n    val surfaceModifier = if (appearance.glassEnabled) modifier else modifier.background(currentBaseColor, shape)\n\n    Surface(\n        modifier = surfaceModifier,\n        shape = shape,\n        color = surfaceColor,"),
              ("        shadowElevation = if (appearance.shadowEnabled) 6.dp else 0.dp,", "        shadowElevation = if (appearance.glassEnabled) 12.dp else if (appearance.shadowEnabled) 6.dp else 0.dp,"),
              ("            Box(modifier = Modifier.fillMaxSize().background(currentBaseColor)) {\n                Box(modifier = Modifier.fillMaxSize().background(normalBrush))", "            Box(modifier = Modifier.fillMaxSize().then(if (appearance.glassEnabled) Modifier else Modifier.background(currentBaseColor))) {\n                Box(modifier = Modifier.fillMaxSize().graphicsLayer { alpha = if (appearance.glassEnabled) 0.72f else 1f }.background(normalBrush))\n                if (appearance.glassEnabled) {\n                    Box(modifier = Modifier.fillMaxSize().background(Color.White.copy(alpha = 0.045f)))\n                }")
          ])
          PY
          chmod +x gradlew

      - name: Build Galaxy Island APK
        working-directory: /tmp/galaxy-island/Galaxy-Island
        run: ./gradlew --no-daemon assembleDebug

      - name: Run unit tests
        working-directory: /tmp/galaxy-island/Galaxy-Island
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Collect APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/galaxy-island-output"
          find /tmp/galaxy-island/Galaxy-Island/app/build/outputs/apk -type f -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/galaxy-island-output/Galaxy-Island-glass-debug.apk" \;

      - name: Upload Galaxy Island APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Island-glass-APK
          path: galaxy-island-output/Galaxy-Island-glass-debug.apk
          if-no-files-found: error
